services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: meetingbot_postgres
    environment:
      POSTGRES_DB: meetingbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5433:5432"
    networks:
      - meetingbot_network
    restart: unless-stopped

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: meetingbot_minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - meetingbot_network
    restart: unless-stopped

  # MeetingBot Server
  server:
    build:
      context: ./src/server
      dockerfile: Dockerfile.local
    container_name: meetingbot_server
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/meetingbot
      PGSSLMODE: disable
      AUTH_SECRET: QTD54ABfY4oiz8lvM6lZ+83BdZiouaHENqKWvcN7i+0=
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      # MinIO configuration (S3-compatible)
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_BUCKET_NAME: meetingbot-recordings
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      # Docker deployment settings
      DEPLOYMENT_MODE: docker-compose
      NEXTAUTH_URL: http://localhost:3000
      BACKEND_URL: http://server:3000
      NEXTAUTH_TRUST_HOST: "true"
      DOCKER_HOST: unix:///var/run/docker.sock
      BOT_NETWORK: meetingbot_meetingbot_network
      # Transcription provider settings
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-assemblyai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      WHISPER_API_URL: ${WHISPER_API_URL:-}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      # Gemini API (for action items and summaries)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Google OAuth (for Google Calendar integration)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Voice-assistant (meet-voice bot) deployment settings forwarded to
      # dynamically-spawned bot containers via `docker run -v`.
      PULSE_RUNTIME_PATH: ${PULSE_RUNTIME_PATH:-/run/user/1000/pulse}
      PULSE_SINK: ${PULSE_SINK:-BotSpeaker}
      PULSE_SOURCE: ${PULSE_SOURCE:-BotMic}
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-http://orchestrator:8080}
      AUDIO_CHUNK_SECONDS: ${AUDIO_CHUNK_SECONDS:-5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - recordings:/app/recordings
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - minio
    networks:
      - meetingbot_network
    restart: unless-stopped

  # Bot containers will be created dynamically by the server

  # Gemini Live Voice Assistant orchestrator (Mode A)
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: meetingbot_orchestrator
    environment:
      PIPELINE_MODE: ${PIPELINE_MODE:-gemini_live}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-live-preview}
      GEMINI_VOICE: ${GEMINI_VOICE:-Aoede}
      PROACTIVE_AUDIO: ${PROACTIVE_AUDIO:-true}
      AUDIO_CHUNK_SECONDS: ${AUDIO_CHUNK_SECONDS:-5}
      TRIGGER_PHRASE: ${TRIGGER_PHRASE:-hey bot}
      BOT_NAME: ${BOT_NAME:-AI Assistant}
      PULSE_SINK: ${PULSE_SINK:-BotSpeaker}
      PULSE_SOURCE: ${PULSE_SOURCE:-BotMic}
      SELF_MUTE_ENABLED: ${SELF_MUTE_ENABLED:-true}
      ORCHESTRATOR_PORT: ${ORCHESTRATOR_PORT:-8080}
      SYSTEM_PROMPT_FILE: ${SYSTEM_PROMPT_FILE:-prompts/gemini_live.txt}
      MEETINGBOT_API_URL: http://server:3000
      # Bind the auth-anonymous socket file directly into /tmp so the
      # container doesn't need traverse perms on the host pulse dir
      # (systemd-logind resets it to 700 on some distros).
      PULSE_SERVER: unix:/tmp/pulse-socket
    volumes:
      - ${PULSE_RUNTIME_PATH:-/run/user/1000/pulse}/anon-native:/tmp/pulse-socket
    ports:
      # Host port is configurable (default 8090) because 8080 is often taken
      # by other services; the in-network URL used by bots stays at :8080.
      - "${ORCHESTRATOR_HOST_PORT:-8090}:8080"
    networks:
      - meetingbot_network
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  recordings:

networks:
  meetingbot_network:
    driver: bridge